version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: digital-twin-backend
    env_file:
      - .env
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      - FRONTEND_URL=${FRONTEND_URL}
    networks:
      - digital-twin-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: digital-twin-frontend
    env_file:
      - .env
    ports:
      - "${FRONTEND_PORT}:80"
    networks:
      - digital-twin-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  digital-twin-network:
    driver: bridge